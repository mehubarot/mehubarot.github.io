<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>מחוברות</title>
  <style>
:root{
  --bg:#f6f7f4;--card:#fff;--ink:#243238;--muted:#6f7b80;--line:#dfe5e1;
  --sage:#96aaa3;--steel:#98a7b7;--sand:#e9dfd5;--lav:#b7a8ce;--soft:#eef1ef;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;overflow-x:hidden;background:linear-gradient(180deg,#fbfbf9,#f2f4f2);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}
body{-webkit-text-size-adjust:100%}
.site{width:100%;max-width:1080px;margin:0 auto;padding:18px 12px 46px}
header{text-align:center;padding:10px 0 18px}
h1{font-size:clamp(38px,11vw,54px);line-height:1;font-weight:760;letter-spacing:.2px;margin:0}

.subtitle{color:var(--muted);font-size:15px}
.controls{
  position:sticky;top:0;z-index:20;background:rgba(248,249,247,.96);
  backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;
  padding:10px;margin-bottom:15px;box-shadow:0 8px 22px rgba(35,49,55,.04)
}
.search-wrap{position:relative;margin-bottom:8px}
#search{
  width:100%;height:48px;border:1px solid var(--line);border-radius:15px;
  padding:0 14px;font:inherit;font-size:16px;background:#fff;color:var(--ink);outline:none
}
#search:focus{border-color:#aebdb8;box-shadow:0 0 0 3px rgba(150,170,163,.12)}
.filters{display:flex;gap:7px;overflow-x:auto;padding:1px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.filter{
  flex:0 0 auto;white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:999px;padding:8px 13px;font:inherit;font-size:13px;cursor:pointer
}
.filter.active{background:#e7edeb;border-color:#cdd9d5}
#count{color:var(--muted);font-size:12.5px;margin:7px 2px 0}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.card{
  width:100%;min-width:0;background:var(--card);border:1px solid var(--line);
  border-radius:24px;padding:20px 16px 16px;box-shadow:0 10px 26px rgba(31,43,48,.05)
}
.name-row{display:flex;justify-content:center;align-items:center;gap:7px}
.name{margin:0;font-size:28px;line-height:1.15;font-weight:730;text-align:center}


.meta{text-align:center;color:var(--muted);font-size:15px;line-height:1.55}
.extra{margin:9px auto 0;background:#f5f6f5;border:1px solid #e7ebe9;border-radius:13px;padding:8px 10px;text-align:center;color:#536268;font-size:13.5px;line-height:1.4}
.rule{height:1px;background:var(--line);margin:15px 0}
.phone-row{
  direction:ltr;display:flex;align-items:center;justify-content:center;gap:11px;
  margin:0 0 15px;color:var(--ink);text-decoration:none
}
.phone-icon{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:var(--soft)}
.phone-icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
.phone{font-size:clamp(27px,8.2vw,32px);font-weight:720;letter-spacing:.3px}
.actions{direction:ltr;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.action{
  direction:rtl;border:0;border-radius:14px;min-height:46px;padding:9px 5px;
  display:flex;align-items:center;justify-content:center;gap:5px;text-decoration:none;
  font:inherit;font-size:12.5px;font-weight:650;cursor:pointer;white-space:nowrap
}
.action-icon{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wa .wa-icon{width:20px;height:20px;overflow:visible;flex:none;display:block}
.call{background:var(--sage);color:#fff}
.wa{background:var(--steel);color:#fff}
.share{background:var(--sand);color:var(--ink)}
.report{display:block;text-align:center;color:#796f8b;text-decoration:none;font-size:12.5px;margin-top:11px;padding:4px}
.hidden{display:none!important}
.share-sheet{position:fixed;inset:0;background:rgba(25,34,38,.28);display:none;align-items:flex-end;justify-content:center;z-index:1000}
.share-sheet.open{display:flex}
.share-panel{width:min(100%,520px);background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -12px 35px rgba(35,49,55,.15)}
.share-panel h3{margin:0 0 14px;text-align:center;font-size:18px}
.share-options{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.share-options a,.share-options button{border:1px solid var(--line);background:#f8f9f8;color:var(--ink);border-radius:14px;padding:12px 10px;text-align:center;text-decoration:none;font:inherit;cursor:pointer}
.share-close{width:100%;margin-top:10px;border:0;background:transparent;color:var(--muted);padding:10px;font:inherit;cursor:pointer}
@media(min-width:820px){
  .site{padding:28px 16px 50px}
  .grid{grid-template-columns:1fr;gap:16px}
  .card{padding:22px 20px 18px}
  .name{font-size:30px}
  .action{font-size:13.5px}
}
@media(max-width:370px){
  .site{padding-left:8px;padding-right:8px}
  .card{padding-left:12px;padding-right:12px}
  .action{font-size:11.5px;gap:3px}
  .action-icon{width:15px;height:15px}
}

.header{text-align:center;margin-bottom:22px;padding:10px 0 18px}
.brand-wrap{display:inline-flex;align-items:center;gap:10px}
.brand{font-size:48px;font-weight:720;margin:0;line-height:1}
.sparkle,.name-sparkle{fill:none;stroke:#b8aacd;stroke-linecap:round;stroke-linejoin:round}
.sparkle{width:18px;height:18px;stroke-width:1.35}
.name-sparkle{width:14px;height:14px;stroke-width:1.25}
.hero-arc{width:84px;height:14px;margin:8px auto 4px;display:block}
.hero-arc path,.name-arc path{fill:none;stroke:#cabfda;stroke-linecap:round}
.hero-arc path{stroke-width:1.3}
.name-arc{width:64px;height:11px;margin:6px auto 8px;display:block}
.name-arc path{stroke-width:1.2}
.wa .wa-icon{width:20px;height:20px;overflow:visible;flex:none;display:block}
@media(max-width:760px){.brand{font-size:40px}}

.data-note{color:var(--muted);font-size:12px;text-align:center;margin:18px 0 0}
</style>
</head>
<body>
<main class="site">
  <header class="header">
  <div class="brand-wrap"><h1 class="brand">מחוברות</h1><svg class="sparkle" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v5M12 16v5M3 12h5M16 12h5M6.4 6.4l3 3M14.6 14.6l3 3M17.6 6.4l-3 3M9.4 14.6l-3 3"/></svg></div>
  <svg class="hero-arc" viewBox="0 0 84 14"><path d="M4 9 C20 2,64 2,80 9"/></svg>
  <div class="subtitle">רשת הקשר של היועצות החינוכיות</div>
</header>

  <section class="controls">
    <div class="search-wrap"><input id="search" type="search" placeholder="חיפוש לפי שם, בית ספר, תפקיד או טלפון"></div>
    <div class="filters">
      <button class="filter active" data-filter="all">הכול</button>
      <button class="filter" data-filter="rg">רמת גן</button>
      <button class="filter" data-filter="gv">גבעתיים</button>
      <button class="filter" data-filter="kg">גני ילדים</button>
      <button class="filter" data-filter="el">יסודי</button>
      <button class="filter" data-filter="sec">על יסודי</button>
      <button class="filter" data-filter="inst">מדריכות</button>
    </div>
    <div id="count"></div>
  </section>

  <section id="grid" class="grid"></section>
</main>


<div id="shareSheet" class="share-sheet">
  <div class="share-panel">
    <h3>איפה לשתף את פרטי הקשר?</h3>
    <div class="share-options">
      <a id="shareWa" target="_blank" rel="noopener">WhatsApp</a>
      <a id="shareMail">מייל</a>
      <a id="shareSms">SMS</a>
      <button type="button" onclick="copyShare()">העתקת פרטים</button>
    </div>
    <button class="share-close" type="button" onclick="closeShare()">סגירה</button>
  </div>
</div>

function normalize(v){ return String(v || '').toLowerCase().replace(/\s+/g,' ').trim(); }
function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* --- טלפון: מקבל כל צורת כתיבה ומחזיר תצוגה + קישור --- */
function phoneDigits(p){
  let d = String(p || '').replace(/\D/g,'');
  if(d.startsWith('972')) d = '0' + d.slice(3);
  if(d && !d.startsWith('0')) d = '0' + d;   // גיליון שהפך את המספר למספר והוריד את ה-0
  return d;
}
function phoneDisplay(p){
  const d = phoneDigits(p);
  if(d.length === 10) return d.slice(0,3) + '-' + d.slice(3,6) + '-' + d.slice(6);
  return String(p || '').trim();
}
function phoneIntl(p){
  const d = phoneDigits(p);
  return d ? '972' + d.slice(1) : '';
}

/* --- קריאת CSV --- */
function parseCSV(text){
  const rows = []; let row = []; let cur = ''; let q = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){
      if(ch === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += ch;
    }else if(ch === '"') q = true;
    else if(ch === ','){ row.push(cur); cur = ''; }
    else if(ch === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
    else if(ch !== '\r') cur += ch;
  }
  if(cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows;
}

/* --- שורה בגיליון -> רשומה באתר --- */
function toRecord(r){
  const c = i => String(r[i] == null ? '' : r[i]).trim();
  const rec = {name:c(0), phone:c(1), institution:c(2), stage:c(3), city:c(4), extra:c(5), second:c(6), order:parseFloat(c(7))};
  rec.lines = [];
  const first = [rec.institution, rec.stage, rec.city].filter(Boolean).join(' · ');
  if(first) rec.lines.push(first);
  if(rec.second) rec.lines.push(rec.second);
  return rec;
}

/* --- סינונים נגזרים אוטומטית מהטקסט --- */
function filterClasses(rec){
  const all = rec.lines.join(' ') + ' ' + rec.extra;
  const meta = rec.lines.join(' ');
  const c = [];
  if(all.includes('רמת גן')) c.push('rg');
  if(all.includes('גבעתיים')) c.push('gv');
  if(meta.includes('גיל הרך') || meta.includes('גני ילדים')) c.push('kg');
  if(meta.includes('על יסודי')) c.push('sec');
  if(/(^|[^ל] |·\s*)יסודי/.test(meta.replace(/על יסודי/g,''))) c.push('el');
  if(rec.extra.includes('מדריכ')) c.push('inst');
  return c;
}

function cardHTML(rec, i){
  const intl = phoneIntl(rec.phone);
  const disp = phoneDisplay(rec.phone);
  const reportText = 'מצאתי טעות בפרטים של ' + rec.name + '\nהפרטים הנכונים הם: ';
  const searchText = [rec.name, disp, rec.phone, rec.lines.join(' '), rec.extra].join(' ');
  return `<article class="card ${filterClasses(rec).join(' ')}" data-search="${esc(searchText)}">
  <div class="name-row"><h2 class="name">${esc(rec.name)}</h2>${ICONS.sparkle}</div>
  ${ICONS.arc}
  ${rec.lines.length ? `<div class="meta">${rec.lines.map(esc).join('<br>')}</div>` : ''}
  ${rec.extra ? `<div class="extra">${esc(rec.extra)}</div>` : ''}
  <div class="rule"></div>
  <a class="phone-row" href="tel:+${intl}">
      ${ICONS.phone}<div class="phone">${esc(disp)}</div>
    </a>
  <div class="actions">
    <a class="action call" href="tel:+${intl}">${ICONS.call}<span>התקשרי</span></a>
    <a class="action wa" href="https://wa.me/${intl}" target="_blank" rel="noopener">${ICONS.wa}<span>WhatsApp</span></a>
    <button class="action share" type="button" onclick="shareContact(${i})">${ICONS.share}<span>שתפי</span></button>
  </div>
  <a class="report" href="https://wa.me/${REPORT_PHONE}?text=${encodeURIComponent(reportText)}" target="_blank" rel="noopener">✎ מצאת טעות בפרטים?</a>
</article>`;
}

function render(rows){
  DATA = rows.map(toRecord).filter(r => r.name && r.phone);
  grid.innerHTML = DATA.map(cardHTML).join('');
  cards = Array.from(grid.querySelectorAll('.card'));
  cards.forEach((card, i) => { card._rec = DATA[i]; });
  applyFilters();
}

function sortCardsForCurrentFilter(){
  const sorted = [...cards].sort((a,b) => {
    const ra = a._rec, rb = b._rec;
    if(activeFilter === 'all'){
      const pa = isNaN(ra.order) ? 999 : ra.order;
      const pb = isNaN(rb.order) ? 999 : rb.order;
      if(pa !== pb) return pa - pb;
    }
    return ra.name.localeCompare(rb.name, 'he');
  });
  sorted.forEach(card => grid.appendChild(card));
}

function applyFilters(){
  sortCardsForCurrentFilter();
  const q = (search.value || '').trim().toLowerCase();
  let shown = 0;
  cards.forEach(card => {
    const textMatch = !q || (card.dataset.search || '').toLowerCase().includes(q);
    const filterMatch = activeFilter === 'all' || card.classList.contains(activeFilter);
    const show = textMatch && filterMatch;
    card.classList.toggle('hidden', !show);
    if(show) shown++;
  });
  count.textContent = `נמצאו ${shown} תוצאות`;
}

search.addEventListener('input', applyFilters);
document.querySelectorAll('.filter').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    applyFilters();
  });
});

function contactText(r){
  const lines = [r.name, ...r.lines];
  lines.push('טלפון: ' + phoneDisplay(r.phone));
  if(r.extra) lines.push(r.extra);
  return lines.join('\n');
}

async function shareContact(i){
  const r = DATA[i];
  const text = contactText(r);
  currentShareText = text;
  if(navigator.share){
    try{
      await navigator.share({title:'פרטי קשר – ' + r.name, text:text});
      return;
    }catch(e){
      if(e && e.name === 'AbortError') return;
    }
  }
  openShare(text);
}

function openShare(text){
  const enc = encodeURIComponent(text);
  document.getElementById('shareWa').href = 'https://wa.me/?text=' + enc;
  document.getElementById('shareMail').href = 'mailto:?subject=' + encodeURIComponent('פרטי קשר – מחוברות') + '&body=' + enc;
  document.getElementById('shareSms').href = 'sms:?&body=' + enc;
  document.getElementById('shareSheet').classList.add('open');
}

function closeShare(){
  document.getElementById('shareSheet').classList.remove('open');
}

async function copyShare(){
  try{
    await navigator.clipboard.writeText(currentShareText);
    closeShare();
    alert('פרטי הקשר הועתקו');
  }catch(e){
    window.prompt('העתיקי את פרטי הקשר:', currentShareText);
  }
}

/* --- טעינה: קודם הרשימה השמורה (מיידי), ואז הגיליון העדכני --- */
render(FALLBACK_ROWS);

async function loadSheet(){
  if(!SHEET_ID) return;
  try{
    const url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&headers=1&t=' + Date.now();
    const res = await fetch(url, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    if(/^\s*</.test(text)) throw new Error('הגיליון לא משותף לצפייה');
    const rows = parseCSV(text).slice(1).filter(r => r.some(v => String(v).trim()));
    if(rows.length < 5) throw new Error('הגיליון ריק מדי');
    render(rows);
  }catch(e){
    console.warn('מחוברות: נשארים עם הרשימה השמורה –', e.message);
  }
}
loadSheet();
</script>
